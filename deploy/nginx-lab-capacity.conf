# Include this fragment only inside an existing TLS-enabled server block.
# HTTP Basic credentials are not safe on a cleartext listener. Keep the
# server-level CSP/security headers; an add_header here would shadow them.

location = /lab-capacity {
    return 308 /lab-capacity/;
}

location ^~ /lab-capacity/ {
    auth_basic "Lab capacity";
    auth_basic_user_file /etc/nginx/auth/lab-capacity.htpasswd;

    limit_except GET HEAD {
        deny all;
    }

    proxy_pass http://127.0.0.1:8087/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8087;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /lab-capacity;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
