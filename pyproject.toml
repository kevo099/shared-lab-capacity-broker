[build-system]
requires = ["setuptools==78.1.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-lab-capacity-broker"
version = "0.1.0"
description = "Deterministic, read-only shared lab capacity planner"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = []
authors = [{name = "Shared Lab Capacity Broker contributors"}]
keywords = ["capacity-planning", "homelab", "proxmox", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]

[project.urls]
Homepage = "https://github.com/kevo099/shared-lab-capacity-broker"
Source = "https://github.com/kevo099/shared-lab-capacity-broker"
Issues = "https://github.com/kevo099/shared-lab-capacity-broker/issues"
"Private vulnerability reporting" = "https://github.com/kevo099/shared-lab-capacity-broker/security/advisories/new"

[project.scripts]
lab-broker = "lab_broker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_broker = ["ui/static/*", "data/*.json", "data/schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lab_broker"]
